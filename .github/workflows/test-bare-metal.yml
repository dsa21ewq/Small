name: Test bare metal (no Python/pip)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'benchmarks/**'
      - '.github/workflows/test-bare-metal.yml'

jobs:
  bare-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: glances
            repo: https://github.com/nicolargo/glances.git
            runtime: python
            force_version: "==3.11.15"
          - project: express
            repo: https://github.com/expressjs/express.git
            runtime: node
            force_version: "==20.12.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build small
        run: cargo build --release

      - name: Clone ${{ matrix.project }}
        run: git clone --depth 1 ${{ matrix.repo }} /tmp/${{ matrix.project }}

      - name: Copy benchmark small.yaml
        run: cp benchmarks/${{ matrix.project }}.yaml /tmp/${{ matrix.project }}/small.yaml

      - name: Force runtime download (pin version)
        working-directory: /tmp/${{ matrix.project }}
        if: matrix.runtime == 'python'
        run: sed -i 's/python: ">=3.10,<3.13"/python: "${{ matrix.force_version }}"/' small.yaml

      - name: Force runtime download (pin version)
        working-directory: /tmp/${{ matrix.project }}
        if: matrix.runtime == 'node'
        run: sed -i 's/node: ">=18"/node: "${{ matrix.force_version }}"/' small.yaml

      - name: small install -y
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small install -y

      - name: small run
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small run

      - name: small clean
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small clean
