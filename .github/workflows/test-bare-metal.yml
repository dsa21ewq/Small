name: Test bare metal (no Python/pip)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'benchmarks/**'
      - '.github/workflows/test-bare-metal.yml'

jobs:
  bare-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: glances
            repo: https://github.com/nicolargo/glances.git
            runtime: python
          - project: cookiecutter
            repo: https://github.com/cookiecutter/cookiecutter.git
            runtime: python
          - project: express
            repo: https://github.com/expressjs/express.git
            runtime: node
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build small
        run: cargo build --release

      - name: Hide system runtimes
        run: |
          if [ "${{ matrix.runtime }}" = "python" ]; then
            for p in $(which -a python3 2>/dev/null || true); do
              echo "Hiding $p"
              sudo mv "$p" "${p}.small-bak"
            done
          fi
          if [ "${{ matrix.runtime }}" = "node" ]; then
            for p in $(which -a node 2>/dev/null || true); do
              echo "Hiding $p"
              sudo mv "$p" "${p}.small-bak"
            done
          fi

      - name: Verify runtime hidden
        if: matrix.runtime == 'python'
        run: |
          if command -v python3; then
            echo "FAIL: python3 still found"
            exit 1
          fi
          echo "OK: no python3 on PATH"

      - name: Verify runtime hidden
        if: matrix.runtime == 'node'
        run: |
          if command -v node; then
            echo "FAIL: node still found"
            exit 1
          fi
          echo "OK: no node on PATH"

      - name: Clone ${{ matrix.project }}
        run: git clone --depth 1 ${{ matrix.repo }} /tmp/${{ matrix.project }}

      - name: Copy benchmark small.yaml
        run: cp benchmarks/${{ matrix.project }}.yaml /tmp/${{ matrix.project }}/small.yaml

      - name: small install -y
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small install -y

      - name: small run
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small run

      - name: small clean
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small clean

      - name: Restore system runtimes
        if: always()
        run: |
          for p in /usr/bin/python3.small-bak /usr/local/bin/python3.small-bak /usr/bin/node.small-bak /usr/local/bin/node.small-bak; do
            if [ -f "$p" ]; then
              sudo mv "$p" "${p%.small-bak}"
            fi
          done
