name: "Test bare metal"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'benchmarks/**'
      - '.github/workflows/test-bare-metal.yml'

jobs:
  bare-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: glances
            repo: https://github.com/nicolargo/glances.git
            runtime: python
          - project: express
            repo: https://github.com/expressjs/express.git
            runtime: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build small
        run: cargo build --release

      - name: Clone project
        run: git clone --depth 1 ${{ matrix.repo }} /tmp/${{ matrix.project }}

      - name: Copy small.yaml
        run: cp benchmarks/${{ matrix.project }}.yaml /tmp/${{ matrix.project }}/small.yaml

      - name: Pin version to force runtime download
        working-directory: /tmp/${{ matrix.project }}
        run: |
          if [ "${{ matrix.runtime }}" = "python" ]; then
            sed -i 's/python:.*/python: "==3.11.15"/' small.yaml
          else
            sed -i 's/node:.*/node: "==20.12.0"/' small.yaml
          fi

      - name: small install -y
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small install -y

      - name: small run
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small run

      - name: small clean
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/target/release/small clean
