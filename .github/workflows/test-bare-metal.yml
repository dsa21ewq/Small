name: Test bare metal (no Python/pip)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'benchmarks/**'
      - '.github/workflows/test-bare-metal.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build small
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: small-binary
          path: target/release/small

  bare-test:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: glances
            repo: https://github.com/nicolargo/glances.git
            runtime: python
          - project: cookiecutter
            repo: https://github.com/cookiecutter/cookiecutter.git
            runtime: python
          - project: express
            repo: https://github.com/expressjs/express.git
            runtime: node
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq && apt-get install -y -qq git ca-certificates

      - name: Verify no Python
        if: matrix.runtime == 'python'
        run: |
          if command -v python3; then
            echo "FAIL: python3 found on bare system"
            exit 1
          fi
          echo "OK: no python3 on bare system"

      - name: Verify no Node
        if: matrix.runtime == 'node'
        run: |
          if command -v node; then
            echo "FAIL: node found on bare system"
            exit 1
          fi
          echo "OK: no node on bare system"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: small-binary

      - name: Make small executable
        run: chmod +x small

      - name: Clone ${{ matrix.project }}
        run: git clone --depth 1 ${{ matrix.repo }} /tmp/${{ matrix.project }}

      - name: Copy benchmark small.yaml
        run: cp benchmarks/${{ matrix.project }}.yaml /tmp/${{ matrix.project }}/small.yaml

      - name: small install -y
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/small install -y

      - name: small run
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/small run

      - name: small clean
        working-directory: /tmp/${{ matrix.project }}
        run: $GITHUB_WORKSPACE/small clean
