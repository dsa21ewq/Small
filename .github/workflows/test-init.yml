name: Test small init

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/init.rs'
      - 'src/yaml.rs'
      - '.github/workflows/test-init.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test-init:
    name: small init → ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - requests
          - flask
          - glances
          - express
        include:
          - project: requests
            repo: https://github.com/psf/requests.git
          - project: flask
            repo: https://github.com/pallets/flask.git
          - project: glances
            repo: https://github.com/nicolargo/glances.git
          - project: express
            repo: https://github.com/expressjs/express.git
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build small
        run: cargo build --release

      - name: Clone ${{ matrix.project }}
        run: git clone --depth 1 ${{ matrix.repo }} /tmp/${{ matrix.project }}

      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Run small init via expect
        working-directory: /tmp/${{ matrix.project }}
        run: |
          BINARY="$GITHUB_WORKSPACE/target/release/small"
          NAME="${{ matrix.project }}"

          cat > /tmp/test_init.exp << 'EXPECT_SCRIPT'
          #!/usr/bin/expect -f
          set timeout 30
          set binary [lindex $argv 0]
          set name [lindex $argv 1]

          spawn $binary init

          expect -re "Project name" { send "$name\r" }
          expect -re "Language" { send "\r" }
          expect -re "version requirement" { send "\r" }

          expect {
              -re "dependency source" { send "y\r" }
              -re "system dependencies" { send "y\r" }
              -re "Entrypoint command" { send "\r" }
              timeout { puts "TIMEOUT at conf/entry"; exit 1 }
          }

          expect {
              -re "Entrypoint command" { send "\r" }
              -re "Test command" { send "\r" }
              timeout { puts "TIMEOUT at entry/test"; exit 1 }
          }

          expect {
              -re "Test command" { send "\r" }
              timeout { puts "TIMEOUT at test"; exit 1 }
          }

          expect {
              -re "Generated small.yaml" { puts "\nSMALL_INIT_OK" }
              timeout { puts "\nSMALL_INIT_FAIL"; exit 1 }
          }
          EXPECT_SCRIPT

          chmod +x /tmp/test_init.exp
          /tmp/test_init.exp "$BINARY" "$NAME"

      - name: Show generated small.yaml
        working-directory: /tmp/${{ matrix.project }}
        run: |
          echo "=== small.yaml for ${{ matrix.project }} ==="
          cat small.yaml

      - name: Validate small.yaml
        working-directory: /tmp/${{ matrix.project }}
        run: |
          errors=0

          check_field() {
            if grep -q "$1" small.yaml; then
              echo "  [OK] $2"
            else
              echo "  [FAIL] $2 — '$1' not found in small.yaml"
              errors=$((errors + 1))
            fi
          }

          echo "Validating small.yaml for ${{ matrix.project }}..."

          check_field "name:" "project.name"
          check_field "language:" "project.language"
          check_field "entrypoint:" "entrypoint"

          if grep -q "language: python" small.yaml; then
            check_field "python:" "runtimes.python"
          elif grep -q "language: node" small.yaml; then
            check_field "node:" "runtimes.node"
          fi

          if [ "$errors" -gt 0 ]; then
            echo "$errors validation(s) failed"
            exit 1
          fi
          echo "All validations passed"
