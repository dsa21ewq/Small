[package]
name = "small"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "small"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
dialoguer = "0.11"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
which = "7"
duct = "0.13"
indicatif = "0.17"
console = "0.15"
anyhow = "1"
dirs = "6"
